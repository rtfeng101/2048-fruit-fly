# The original 2,320-neuron circuit (no dopamine neurons), backed up in data/circuit_2320/.
# Use it to eval/play runs trained on it (gain10, ppo_dopamine):
#   python -m flybrain2048 eval --config config_2320.yaml --checkpoint runs/ppo_dopamine/best.pt
connectome:
  source: neuprint            # "synthetic" (offline) or "neuprint" (real male CNS)
  cache_path: data/circuit_2320/connectome_{source}.npz
  morphology_path: data/circuit_2320/morphology_{source}.npz   # neuron shapes for `play` (fetch --shapes)
  synapse_path: data/circuit_2320/synapses_{source}.npz        # synapse locations for signal paths (fetch --shapes)

  synthetic:
    n_in: 256
    n_hidden: 2000
    n_out: 64
    p: 0.05                    # connection probability
    frac_inhib: 0.3
    seed: 0
    n_dopamine: 16             # stand-in dopamine neurons for the critic

  neuprint:
    server: neuprint.janelia.org
    dataset: male-cns:v1.0     # check the exact name/version on neuprint.janelia.org
    output_type_regex: "DN[a-z][0-9].*"  # descending neurons (DNa01, DNg12, ...) = motor commands;
                                         # plain "DN.*" also matches clock (DN1a) + neurosecretory (DNES) cells
    n_out: 64                  # kept at 64 so the move readout is the same as before
    n_hidden: 2000
    n_in: 256
    min_weight: 5              # ignore connections weaker than this many synapses
    dopamine:                  # dopamine neurons for the critic to read (model.critic: dopamine)
      n: 0                     # this circuit was built before dopamine neurons were added
      type_regex: "(PAM|PPL1|PPL2|PPM).*"   # dopaminergic cell types (check the names on neuPrint)
    skeleton_grid: 100         # snap neuron shapes to this many voxels (bigger = smaller file)
    path_connections: 3000     # strongest connections to fetch a synapse location for, so
                               # `play` can draw their signal along the real wiring
    outline_rois: null         # brain regions for the outline; null = all top-level regions

model:
  steps: 8                     # recurrent time steps per move ("thinking time")
  dt: 0.5
  w_scale: 10.0                # overall connectome gain; at 1.0 the board signal fades out
                               # before reaching the DNs (too low = fly ignores the board)
  train_synapses: true         # false = only train sensory input + readout + biases
  normalize_readout: true      # rescale DN activity so small differences between moves count
  readout: learned             # "grouped" = each move is the plain average of its DNs (round
                               # robin); "learned" = learn how much each DN counts per move
  critic: brain                # the critic PPO needs, predicting reward still to come. "dopamine"
                               # reads it from the circuit's dopamine neurons, "brain" from all neurons

train:
  run_name: ppo_dopamine
  updates: 500
  batch_games: 32              # games played per update
  max_moves: 2000
  lr: 0.001
  gamma: 0.99
  gae_lambda: 0.95             # how far the critic's surprises are credited back to earlier moves
  reward_scale: 0.1            # rewards are scaled down so the critic's targets stay small
  ppo_epochs: 4                # passes over each batch of moves
  minibatch: 2048              # moves per gradient step
  clip: 0.2                    # PPO: how far one update may move each move's probability
  value_coef: 0.5              # weight of the critic's loss next to the policy's
  entropy_coef: 0.01
  augment: false               # play each move on a randomly rotated/mirrored copy of the board.
                               # Off because it stops the fly learning a fixed "favourite direction"
                               # (e.g. keep tiles in one corner), and learning was much slower
  print_every: 10
  checkpoint_every: 1000       # also save runs/<run_name>/update_NNNNNN.pt every N updates; 0 = off
  seed: 0
